<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980">
  <rect width="1100" height="980" fill="#0c1019"/>
  <text x="40" y="48" fill="#e6ecf5" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Plasmoid X · palette options</text>
  <text x="40" y="78" fill="#9aadc4" font-family="system-ui,sans-serif" font-size="14">One teal accent, calm surfaces, readable contrast. Pick what feels less dark.</text>

  <!-- A -->
  <rect x="32" y="110" width="1036" height="190" rx="16" fill="#141c2c"/>
  <rect x="52" y="134" width="268" height="142" rx="12" fill="#1c263a"/>
  <text x="72" y="178" fill="#eef2f8" font-family="system-ui,sans-serif" font-size="20" font-weight="700">New energy,</text>
  <text x="72" y="204" fill="#eef2f8" font-family="system-ui,sans-serif" font-size="20" font-weight="700">explained simply.</text>
  <text x="72" y="236" fill="#9aadc4" font-family="system-ui,sans-serif" font-size="13">Sample body · Soft Lift (dark)</text>
  <rect x="72" y="250" width="150" height="28" rx="14" fill="#5eead4"/>
  <text x="88" y="269" fill="#07090f" font-family="system-ui,sans-serif" font-size="12" font-weight="600">See how it works</text>
  <rect x="360" y="150" width="70" height="60" rx="8" fill="#141c2c" stroke="#3a4a66"/>
  <rect x="442" y="150" width="70" height="60" rx="8" fill="#1c263a"/>
  <rect x="524" y="150" width="70" height="60" rx="8" fill="#eef2f8"/>
  <rect x="606" y="150" width="70" height="60" rx="8" fill="#9aadc4"/>
  <rect x="688" y="150" width="70" height="60" rx="8" fill="#5eead4"/>
  <text x="360" y="240" fill="#eef2f8" font-family="system-ui,sans-serif" font-size="18" font-weight="700">A · Soft Lift (dark)</text>
  <text x="360" y="268" fill="#9aadc4" font-family="system-ui,sans-serif" font-size="14">Same teal energy, less cave-black. Night mode, lifted.</text>

  <!-- B -->
  <rect x="32" y="318" width="1036" height="190" rx="16" fill="#1e2838"/>
  <rect x="52" y="342" width="268" height="142" rx="12" fill="#273348"/>
  <text x="72" y="386" fill="#f2f5fa" font-family="system-ui,sans-serif" font-size="20" font-weight="700">New energy,</text>
  <text x="72" y="412" fill="#f2f5fa" font-family="system-ui,sans-serif" font-size="20" font-weight="700">explained simply.</text>
  <text x="72" y="444" fill="#a8b8cd" font-family="system-ui,sans-serif" font-size="13">Sample body · Soft Slate</text>
  <rect x="72" y="458" width="150" height="28" rx="14" fill="#4fd1c5"/>
  <text x="88" y="477" fill="#07090f" font-family="system-ui,sans-serif" font-size="12" font-weight="600">See how it works</text>
  <rect x="360" y="358" width="70" height="60" rx="8" fill="#1e2838" stroke="#4a5a70"/>
  <rect x="442" y="358" width="70" height="60" rx="8" fill="#273348"/>
  <rect x="524" y="358" width="70" height="60" rx="8" fill="#f2f5fa"/>
  <rect x="606" y="358" width="70" height="60" rx="8" fill="#a8b8cd"/>
  <rect x="688" y="358" width="70" height="60" rx="8" fill="#4fd1c5"/>
  <text x="360" y="448" fill="#f2f5fa" font-family="system-ui,sans-serif" font-size="18" font-weight="700">B · Soft Slate</text>
  <text x="360" y="476" fill="#a8b8cd" font-family="system-ui,sans-serif" font-size="14">Airier blue-gray dark. Easier in daylight.</text>

  <!-- C -->
  <rect x="32" y="526" width="1036" height="190" rx="16" fill="#f5f7fb" stroke="#d0dae8"/>
  <rect x="52" y="550" width="268" height="142" rx="12" fill="#ffffff" stroke="#d0dae8"/>
  <text x="72" y="594" fill="#121826" font-family="system-ui,sans-serif" font-size="20" font-weight="700">New energy,</text>
  <text x="72" y="620" fill="#121826" font-family="system-ui,sans-serif" font-size="20" font-weight="700">explained simply.</text>
  <text x="72" y="652" fill="#5a6f8f" font-family="system-ui,sans-serif" font-size="13">Sample body · Daylight Paper</text>
  <rect x="72" y="666" width="150" height="28" rx="14" fill="#0f766e"/>
  <text x="88" y="685" fill="#f4f7fb" font-family="system-ui,sans-serif" font-size="12" font-weight="600">See how it works</text>
  <rect x="360" y="566" width="70" height="60" rx="8" fill="#f5f7fb" stroke="#c8d4e6"/>
  <rect x="442" y="566" width="70" height="60" rx="8" fill="#ffffff" stroke="#c8d4e6"/>
  <rect x="524" y="566" width="70" height="60" rx="8" fill="#121826"/>
  <rect x="606" y="566" width="70" height="60" rx="8" fill="#5a6f8f"/>
  <rect x="688" y="566" width="70" height="60" rx="8" fill="#0f766e"/>
  <text x="360" y="656" fill="#121826" font-family="system-ui,sans-serif" font-size="18" font-weight="700">C · Daylight Paper</text>
  <text x="360" y="684" fill="#5a6f8f" font-family="system-ui,sans-serif" font-size="14">Light as default. Clean paper + deep teal. Most everyday-friendly.</text>

  <!-- D -->
  <rect x="32" y="734" width="1036" height="190" rx="16" fill="#f7f5f1" stroke="#ddd6cc"/>
  <rect x="52" y="758" width="268" height="142" rx="12" fill="#ffffff" stroke="#ddd6cc"/>
  <text x="72" y="802" fill="#1a1714" font-family="system-ui,sans-serif" font-size="20" font-weight="700">New energy,</text>
  <text x="72" y="828" fill="#1a1714" font-family="system-ui,sans-serif" font-size="20" font-weight="700">explained simply.</text>
  <text x="72" y="860" fill="#6b655c" font-family="system-ui,sans-serif" font-size="13">Sample body · Warm Daylight</text>
  <rect x="72" y="874" width="150" height="28" rx="14" fill="#0d9488"/>
  <text x="88" y="893" fill="#f4f7fb" font-family="system-ui,sans-serif" font-size="12" font-weight="600">See how it works</text>
  <rect x="360" y="774" width="70" height="60" rx="8" fill="#f7f5f1" stroke="#d4ccc0"/>
  <rect x="442" y="774" width="70" height="60" rx="8" fill="#ffffff" stroke="#d4ccc0"/>
  <rect x="524" y="774" width="70" height="60" rx="8" fill="#1a1714"/>
  <rect x="606" y="774" width="70" height="60" rx="8" fill="#6b655c"/>
  <rect x="688" y="774" width="70" height="60" rx="8" fill="#0d9488"/>
  <text x="360" y="864" fill="#1a1714" font-family="system-ui,sans-serif" font-size="18" font-weight="700">D · Warm Daylight</text>
  <text x="360" y="892" fill="#6b655c" font-family="system-ui,sans-serif" font-size="14">Warm off-white. Approachable, less clinical than cool gray.</text>
</svg>
