name: Deploy to plasmoidx.com
# Manual only: runs when started from the Actions tab or `gh workflow run deploy.yml`.
on:
  workflow_dispatch:
    inputs:
      prune_dry_run:
        description: "Log stale-file deletions without deleting"
        type: boolean
        default: false
      prune_max_deletes:
        description: "Deletion cap (default 50). Raise only for a one-time approved cleanup."
        type: string
        default: "50"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.NEXT_PUBLIC_GSC_VERIFICATION }}
          NEXT_PUBLIC_NEWSLETTER_ACTION: ${{ vars.NEXT_PUBLIC_NEWSLETTER_ACTION }}
      - run: pip install paramiko
      - run: python scripts/sftp-deploy.py
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          PRUNE_DRY_RUN: ${{ inputs.prune_dry_run }}
          PRUNE_MAX_DELETES: ${{ inputs.prune_max_deletes }}
      # Post-deploy: tell IndexNow (Bing, Yandex, etc.) about every sitemap URL. Never fails the deploy.
      - name: Submit URLs to IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs
